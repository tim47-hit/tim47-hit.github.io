<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tomlamena</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="content">
        <audio id="bg-music" src="music.mp3" autoplay loop></audio>
    </div>

    <!-- Message discret et élégant en bas à droite -->
    <div id="interaction-message" class="elegant-script">
        touch the screen listen and dive
    </div>

    <script>
        function startMusic() {
            var audio = document.getElementById('bg-music');
            audio.play();
            // Fait disparaître le message en douceur une fois que l'utilisateur a cliqué
            var message = document.getElementById('interaction-message');
            message.style.opacity = '0';
            setTimeout(function() {
                message.style.display = 'none';
            }, 1000);
        }

        document.addEventListener('click', startMusic, { once: true });
        document.addEventListener('touchstart', startMusic, { once: true });
    </script>
<script data-goatcounter="https://tim-h.goatcounter.com/count"
        async src="//gc.zgo.at/count.js"></script>
</body>
</html>
