<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tomlamena</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="content">
        <!-- Le lecteur est maintenant masqué et configuré en autoplay -->
        <audio id="bg-music" src="music.mp3" autoplay loop></audio>
    </div>

    <!-- Ce petit script force la musique à démarrer dès que l'utilisateur touche l'écran, pour contourner le blocage Android/Brave -->
    <script>
        document.addEventListener('click', function() {
            var audio = document.getElementById('bg-music');
            audio.play();
        }, { once: true });
        
        document.addEventListener('touchstart', function() {
            var audio = document.getElementById('bg-music');
            audio.play();
        }, { once: true });
    </script>
</body>
</html>
